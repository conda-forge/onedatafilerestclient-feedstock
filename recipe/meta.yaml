{% set name = "onedatafilerestclient" %}
{% set version = "25.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/onedatafilerestclient-{{ version }}.tar.gz
  sha256: 54e469da32c3a057f3a0d2dd212886eeeedefee40c622cb6b3e7bd6d07458822

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - packaging
    - requests
    - typing_extensions >=4.3.0

test:
  imports:
    - onedatafilerestclient
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/onedata/onedatafilerestclient
  summary: Onedata REST file API client
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - bgruening
